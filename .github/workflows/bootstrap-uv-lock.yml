name: Bootstrap uv lock

on:
  push:
    branches: [chore/uv-sqlfluff-ci]

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'cbwinslow/Tarkka'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: chore/uv-sqlfluff-ci
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Resolve lockfile
        run: uv lock
      - name: Commit lockfile if needed
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: commit uv lockfile"
          git push origin HEAD:chore/uv-sqlfluff-ci
