name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync development environment
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy
      - name: SQLFluff
        run: uv run --no-sync sqlfluff lint migrations
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/
          online-audits: false
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: high
          version: 1.29.0

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync development environment
        run: uv sync --frozen --group dev
      - name: Pytest
        if: matrix.python-version != '3.13'
        run: >-
          uv run --no-sync pytest -m "not external"
          --junitxml=test-results.xml
      - name: Pytest with branch coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync pytest -m "not external"
          --junitxml=test-results.xml
          --cov=tarkka --cov-branch
          --cov-report=term-missing --cov-report=xml
      - name: Enforce changed-line coverage
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: >-
          uv run --no-sync python scripts/check_diff_coverage.py
          --base origin/main
          --coverage coverage.xml
          --minimum 80
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
