name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Immutable pre-Phase-5 anchor for the cumulative coverage ratchet. Keep this a
# commit SHA rather than a movable ref so the protected historical range cannot
# be weakened accidentally; advance it only as an explicit coverage-policy change.
env:
  PHASE5_COVERAGE_BASE: 7e4f51ddb14a44c1b32a782d3cbdbb7c06a41b01

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync development environment
        run: uv sync --frozen --group dev --extra mcp
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy
      - name: SQLFluff
        run: uv run --no-sync sqlfluff lint migrations
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/
          online-audits: false
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: high
          version: 1.29.0

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync development environment
        run: uv sync --frozen --group dev --extra mcp
      - name: Pytest
        if: matrix.python-version != '3.13'
        run: >-
          uv run --no-sync pytest -m "not external"
          --junitxml=test-results.xml
      - name: Pytest with branch coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync pytest -m "not external"
          --junitxml=test-results.xml
          --cov=tarkka --cov=scripts --cov-branch
          --cov-report=term-missing --cov-report=xml
      - name: Enforce Phase 5 agent-serving coverage
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          # coverage.py runs from the checked-out repository root, so these are
          # intentionally repository-relative source-file patterns.
          include_patterns=(
            src/tarkka/application/document_context_packages.py
            src/tarkka/application/document_retrieval.py
            src/tarkka/application/research_capabilities.py
            src/tarkka/application/saved_document_context_packages.py
            src/tarkka/domain/context_packages.py
            src/tarkka/domain/telemetry.py
            src/tarkka/infrastructure/postgres/context_package_repository.py
            src/tarkka/infrastructure/storage/json_context_package_repository.py
            src/tarkka/infrastructure/storage/jsonl_telemetry.py
            src/tarkka/interfaces/mcp.py
            src/tarkka/ports/context_packages.py
            src/tarkka/ports/telemetry.py
          )
          include_csv="$(IFS=,; echo "${include_patterns[*]}")"
          uv run --no-sync coverage report \
            --include="${include_csv}" \
            --fail-under=100
      - name: Enforce coverage tooling coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=scripts/check_diff_coverage.py
          --fail-under=100
      - name: Enforce interface runtime coverage
        # The complete interface/runtime slice reached 100% branch coverage in
        # #187 and is now permanently protected against regression.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/__main__.py,src/tarkka/interfaces/cli.py,src/tarkka/interfaces/main.py
          --fail-under=100
      - name: Enforce core domain invariant coverage
        # Completed pure-domain contracts under #188 are permanently protected
        # so later work cannot regress already-eliminated historical debt.
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          include_patterns=(
            src/tarkka/domain/bibliography.py
            src/tarkka/domain/citations.py
            src/tarkka/domain/discovery.py
            src/tarkka/domain/identity_candidates.py
            src/tarkka/domain/media_types.py
            src/tarkka/domain/models.py
            src/tarkka/domain/policy_requests.py
            src/tarkka/domain/rights_access.py
            src/tarkka/domain/source_artifacts.py
            src/tarkka/domain/source_observations.py
            src/tarkka/domain/traversal.py
            src/tarkka/domain/verification.py
            src/tarkka/domain/work_identity.py
          )
          include_csv="$(IFS=,; echo "${include_patterns[*]}")"
          uv run --no-sync coverage report \
            --include="${include_csv}" \
            --fail-under=100
      - name: Enforce security domain coverage
        # Security/provenance/robots boundaries completed under #189 are
        # ratcheted immediately so later network work cannot weaken them.
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          include_patterns=(
            src/tarkka/domain/crawl_access.py
            src/tarkka/domain/http_observations.py
            src/tarkka/domain/policy_fetch_finalization.py
            src/tarkka/domain/resource_acquisition.py
            src/tarkka/domain/robots_cache.py
            src/tarkka/domain/robots_rules.py
          )
          include_csv="$(IFS=,; echo "${include_patterns[*]}")"
          uv run --no-sync coverage report \
            --include="${include_csv}" \
            --fail-under=100
      - name: Enforce security application coverage
        # Crawl, robots, HTTP acquisition, policy fetch, and full-text orchestration
        # completed under #189 are permanently protected against regression.
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          include_patterns=(
            src/tarkka/application/crawl_eligibility.py
            src/tarkka/application/full_text.py
            src/tarkka/application/http_acquisition.py
            src/tarkka/application/http_policy_fetch.py
            src/tarkka/application/recursive_crawl.py
            src/tarkka/application/robots_refresh.py
          )
          include_csv="$(IFS=,; echo "${include_patterns[*]}")"
          uv run --no-sync coverage report \
            --include="${include_csv}" \
            --fail-under=100
      - name: Enforce HTTP transport coverage
        # The full-text resource contract plus general/full-text resolver/transport
        # boundaries completed under #189 are protected against SSRF/path/TLS debt.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/ports/full_text.py,src/tarkka/ports/http_transport.py,src/tarkka/infrastructure/web/pinned_http_transport.py,src/tarkka/infrastructure/full_text/http.py
          --fail-under=100
      - name: Enforce PostgreSQL persistence foundation coverage
        # The connection/error taxonomy, migration durability, and acquisition
        # provenance foundation completed under #190 are permanently protected.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/infrastructure/postgres/acquisition_recorder.py,src/tarkka/infrastructure/postgres/connection.py,src/tarkka/infrastructure/postgres/migrations.py
          --fail-under=100
      - name: Enforce PostgreSQL repository contract coverage
        # High-coverage citation-context, Work, and verification repositories
        # completed under #190 are permanently protected against regression.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/infrastructure/postgres/citation_context_repository.py,src/tarkka/infrastructure/postgres/work_repository.py,src/tarkka/infrastructure/postgres/verification_repository.py
          --fail-under=100
      - name: Enforce PostgreSQL research repository coverage
        # Immutable artifact/document graph persistence completed under #190 is
        # permanently protected after reaching full statement and branch coverage.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/infrastructure/postgres/research_repository.py
          --fail-under=100
      - name: Enforce PostgreSQL source observation coverage
        # Stable source-observation and resource-link persistence completed under
        # #190 is permanently protected after reaching full statement/branch coverage.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/infrastructure/postgres/source_observation_repository.py
          --fail-under=100
      - name: Enforce PostgreSQL extraction repository coverage
        # Extraction persistence completed under #190 is permanently protected
        # after reaching full statement and branch coverage.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync coverage report
          --include=src/tarkka/infrastructure/postgres/extraction_repository.py
          --fail-under=100
      - name: Enforce full coverage of recent Phase 5 changes
        # This is a permanent cumulative ratchet, so it intentionally runs both
        # on pull requests and on pushes to main.
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync python scripts/check_diff_coverage.py
          --base "$PHASE5_COVERAGE_BASE"
          --coverage coverage.xml
          --minimum 100
      - name: Enforce changed-line coverage
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: >-
          uv run --no-sync python scripts/check_diff_coverage.py
          --base origin/main
          --coverage coverage.xml
          --minimum 100
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
