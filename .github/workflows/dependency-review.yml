name: Dependency Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-submission:
    name: Submit uv.lock dependencies
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out PR base
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Submit PR base uv.lock dependencies
        if: ${{ github.event_name == 'pull_request' }}
        uses: advanced-security/component-detection-dependency-submission-action@31f25a8de68ae5ce2ca274bc28546a78683c15ce # v0.1.4
        with:
          detectorArgs: "UvLock=EnableIfDefaultOff"
          snapshot-sha: ${{ github.event.pull_request.base.sha }}
          snapshot-ref: ${{ format('refs/heads/{0}', github.event.pull_request.base.ref) }}
          correlator: dependency-submission-base

      - name: Check out PR head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Submit PR head uv.lock dependencies
        if: ${{ github.event_name == 'pull_request' }}
        uses: advanced-security/component-detection-dependency-submission-action@31f25a8de68ae5ce2ca274bc28546a78683c15ce # v0.1.4
        with:
          detectorArgs: "UvLock=EnableIfDefaultOff"
          snapshot-sha: ${{ github.event.pull_request.head.sha }}
          snapshot-ref: ${{ format('refs/heads/{0}', github.event.pull_request.head.ref) }}
          correlator: dependency-submission-head

      - name: Check out pushed main
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submit pushed main uv.lock dependencies
        if: ${{ github.event_name == 'push' }}
        uses: advanced-security/component-detection-dependency-submission-action@31f25a8de68ae5ce2ca274bc28546a78683c15ce # v0.1.4
        with:
          detectorArgs: "UvLock=EnableIfDefaultOff"
          snapshot-sha: ${{ github.sha }}
          snapshot-ref: ${{ github.ref }}
          correlator: dependency-submission-main

  dependency-review:
    name: Review dependency changes
    needs: dependency-submission
    # Submission and review are independent security signals. Preserve dependency
    # review after any non-cancelled same-repository PR submission result; pushes
    # to main submit the new base snapshot but do not run PR-only dependency review.
    if: ${{ github.event_name == 'pull_request' && always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
