name: Docling Integration

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/tarkka/infrastructure/storage/docling_parser.py"
      - "src/tarkka/infrastructure/storage/markdown_normalizer.py"
      - "tests/test_docling_adapter.py"
      - "tests/test_docling_model_contract.py"
      - ".github/workflows/docling.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/tarkka/infrastructure/storage/docling_parser.py"
      - "src/tarkka/infrastructure/storage/markdown_normalizer.py"
      - "tests/test_docling_adapter.py"
      - "tests/test_docling_model_contract.py"
      - ".github/workflows/docling.yml"

concurrency:
  group: docling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docling-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create integration environment
        run: uv venv --python 3.12 --seed
      - name: Install Docling integration (CPU)
        # PyTorch's CPU index also contains stale copies of generic packages.
        # pip's extra-index behavior is intentionally retained for this one
        # specialized integration instead of weakening uv's safe first-index policy.
        run: >-
          .venv/bin/python -m pip install -e '.[docling]'
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install development test tools
        run: uv pip install --group dev
      - name: Verify optional adapter
        run: >-
          uv run --no-sync python -c "from tarkka.infrastructure.storage.docling_parser import DoclingParser;
          assert DoclingParser.is_available()"
      - name: Verify Docling model contract
        run: >-
          uv run --no-sync python -c "from docling_core.types.doc import DocItemLabel;
          assert DocItemLabel.FORMULA.value == 'formula'"
      - name: Run adapter contract tests
        run: >-
          uv run --no-sync pytest
          tests/test_docling_adapter.py
          tests/test_docling_model_contract.py
