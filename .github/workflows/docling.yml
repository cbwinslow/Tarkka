name: Docling Integration

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/tarkka/infrastructure/storage/docling_parser.py"
      - "src/tarkka/infrastructure/storage/markdown_normalizer.py"
      - "tests/test_docling_adapter.py"
      - ".github/workflows/docling.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/tarkka/infrastructure/storage/docling_parser.py"
      - "src/tarkka/infrastructure/storage/markdown_normalizer.py"
      - "tests/test_docling_adapter.py"
      - ".github/workflows/docling.yml"

concurrency:
  group: docling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docling-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Docling integration (CPU)
        run: >-
          python -m pip install -e '.[dev,docling]'
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Verify optional adapter
        run: >-
          python -c "from tarkka.infrastructure.storage.docling_parser import DoclingParser;
          assert DoclingParser.is_available()"
      - name: Run adapter tests
        run: pytest tests/test_docling_adapter.py
