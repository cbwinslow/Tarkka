name: Package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pyproject.toml"
      - "README.md"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-install:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Verify build artifacts
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python -m zipfile -l "${wheels[0]}" | grep 'tarkka/'

      - name: Install wheel into clean environment
        run: |
          uv venv --python 3.13 .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl

      - name: Smoke-test installed package and CLI
        run: |
          .package-venv/bin/python -c "import tarkka"
          .package-venv/bin/tarkka --help

      - name: Retain distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
