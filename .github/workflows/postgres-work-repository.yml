name: PostgreSQL repositories

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/postgres-work-repository.yml"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/tarkka/domain/discovery.py"
      - "src/tarkka/domain/models.py"
      - "src/tarkka/domain/work_identity.py"
      - "src/tarkka/interfaces/cli.py"
      - "src/tarkka/interfaces/main.py"
      - "src/tarkka/ports/works.py"
      - "src/tarkka/infrastructure/postgres/**"
      - "tests/contracts/work_repository.py"
      - "tests/contracts/research_repository.py"
      - "tests/test_postgres_work_repository_contract.py"
      - "tests/test_postgres_verification_repository_contract.py"
      - "tests/test_postgres_research_repository_contract.py"
      - "tests/test_postgres_acquisition_recorder_contract.py"
      - "tests/test_postgres_work_repository_unit.py"
      - "tests/test_postgres_verification_repository_unit.py"
      - "tests/test_postgres_research_repository_unit.py"
      - "tests/test_postgres_acquisition_recorder_unit.py"
      - "tests/test_work_cli_backend.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/postgres-work-repository.yml"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/tarkka/domain/discovery.py"
      - "src/tarkka/domain/models.py"
      - "src/tarkka/domain/work_identity.py"
      - "src/tarkka/interfaces/cli.py"
      - "src/tarkka/interfaces/main.py"
      - "src/tarkka/ports/works.py"
      - "src/tarkka/infrastructure/postgres/**"
      - "tests/contracts/work_repository.py"
      - "tests/contracts/research_repository.py"
      - "tests/test_postgres_work_repository_contract.py"
      - "tests/test_postgres_verification_repository_contract.py"
      - "tests/test_postgres_research_repository_contract.py"
      - "tests/test_postgres_acquisition_recorder_contract.py"
      - "tests/test_postgres_work_repository_unit.py"
      - "tests/test_postgres_verification_repository_unit.py"
      - "tests/test_postgres_research_repository_unit.py"
      - "tests/test_postgres_acquisition_recorder_unit.py"
      - "tests/test_work_cli_backend.py"

concurrency:
  group: postgres-work-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-work-repository:
    name: PostgreSQL repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tarkka
          POSTGRES_DB: tarkka_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarkka -d tarkka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This database exists only inside the ephemeral Actions job; trust auth avoids fake secrets.
      TARKKA_DATABASE_URL: postgresql://tarkka@localhost:5432/tarkka_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync PostgreSQL test environment
        run: uv sync --frozen --group dev --extra postgres
      - name: Run PostgreSQL repository contracts
        run: >-
          uv run --no-sync tarkka db upgrade && uv run --no-sync pytest
          tests/test_postgres_work_repository_contract.py
          tests/test_postgres_verification_repository_contract.py
          tests/test_postgres_research_repository_contract.py
          tests/test_postgres_acquisition_recorder_contract.py
          --junitxml=postgres-work-repository-results.xml
      - name: Retain PostgreSQL contract results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-repositories-junit
          path: postgres-work-repository-results.xml
          if-no-files-found: warn
          retention-days: 14
