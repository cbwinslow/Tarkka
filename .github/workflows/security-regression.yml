name: Security Regression

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/security-regression.yml"

concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync development environment
        run: uv sync --frozen --group dev --extra mcp
      - name: Run security regression corpus
        run: >-
          uv run --no-sync pytest
          -m "security and not external"
          --junitxml=security-test-results.xml
          --hypothesis-show-statistics
      - name: Retain security test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-regression-junit
          path: security-test-results.xml
          if-no-files-found: warn
          retention-days: 14
