[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarkka"
version = "0.1.0"
description = "Agent-first, evidence-grounded research infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Tarkka contributors"}]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
docling = ["docling>=2.117,<3"]
all = ["psycopg[binary]>=3.2,<4", "docling>=2.117,<3"]

[dependency-groups]
dev = [
    "hypothesis>=6.124",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "sqlfluff>=4.3,<5",
]

[project.scripts]
tarkka = "tarkka.interfaces.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkka"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "tarkka/migrations"

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: isolated deterministic behavior without external services",
    "contract: public/domain/port invariants and compatibility contracts",
    "integration: collaboration between multiple Tarkka components",
    "regression: a previously observed failure that must not recur",
    "property: property-based invariant tests generated across many inputs",
    "security: adversarial security and provenance boundary coverage",
    "slow: intentionally expensive deterministic tests excluded from fast feedback loops",
    "external: opt-in tests requiring network, databases, models, or other services",
]

[tool.coverage.run]
branch = true
source = ["tarkka"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "raw"
max_line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tarkka"]

[tool.mutmut]
source_paths = ["src/tarkka"]
only_mutate = [
    "src/tarkka/domain/identifiers.py",
    "src/tarkka/infrastructure/storage/parser_identity.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_identifiers.py",
    "tests/test_parser_identity.py",
]
mutate_only_covered_lines = true
max_stack_depth = 8

[tool.tarkka.mutation-testing]
tool = "mutmut==3.7.0"
command = "uv run --with mutmut==3.7.0 mutmut"
