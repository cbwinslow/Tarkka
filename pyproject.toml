[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarkka"
version = "0.1.0"
description = "Agent-first, evidence-grounded research infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "License TBD"}
authors = [{name = "Tarkka contributors"}]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
docling = ["docling>=2.117,<3"]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]
all = ["tarkka[postgres,docling]"]

[project.scripts]
tarkka = "tarkka.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarkka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tarkka"]
